[project]
name = "rag-eval"
version = "0.1.0"
description = "RAG over Kubernetes docs with rigorous evaluation and continuous validation"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0",
    "qdrant-client>=1.9",
    "sentence-transformers>=3.0",
    "tqdm>=4.66",
]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag", "src/evals"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
